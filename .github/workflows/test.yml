name: Run regression tests

on:
  push:
    branches:
      - main
      - release
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      target_container:
        description: The target container with which to run the suite (full tag, e.g. dev-main)
        type: string
        required: true
        default: dev-main
      firedrake_repo:
        description: GitHub repository (owner/name) to fetch the Firedrake branch from
        type: string
        default: firedrakeproject/firedrake
      firedrake_ref:
        description: Firedrake branch or commit to install over the Firedrake in the container
        type: string
        default: sghelichkhani/fix-for-gadopt-pyop3

# DROP BEFORE MERGE: temporary test of the pyop3 slowdown fixes. The Firedrake
# in the container is replaced by FIREDRAKE_REF from FIREDRAKE_REPO in both
# jobs. On pull request and push events there are no inputs, so the defaults
# below apply. sghelichkhani/fix-for-gadopt-pyop3 is origin/main with the open
# Firedrake PRs #5560 (with #5562), #5564 and #5569 and five further fixes
# merged in.
env:
  FIREDRAKE_REPO: ${{ inputs.firedrake_repo || 'firedrakeproject/firedrake' }}
  FIREDRAKE_REF: ${{ inputs.firedrake_ref || 'sghelichkhani/fix-for-gadopt-pyop3' }}

jobs:
  check_commit:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_commit.outputs.skip }}
    steps:
      - name: Always run tests on workflow dispatch
        id: early_exit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run:
          echo skip=true >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: ${{ steps.early_exit.outputs.skip != 'true' }}
        with:
          ref: ${{ github.event.push.after || github.event.pull_request.head.sha || github.event.workflow_dispatch.ref }}
      - name: Check if message contains skip keyword
        id: check_commit
        if: ${{ steps.early_exit.outputs.skip != 'true' }}
        run: |
          message=$(git log -1 --pretty=format:'%B')
          regex="\[skip tests\]"
          if [[ "$message" =~ $regex ]]; then
            echo skip=true >> "$GITHUB_OUTPUT"
          fi

  smoke_test:
    name: Run smoke test
    runs-on: ubuntu-latest
    container:
      # Prefer specific branch, then PR base, then actual branch
      image: firedrakeproject/firedrake-vanilla-default:${{ inputs.target_container || (github.event_name == 'pull_request' && case(contains(github.event.pull_request.labels.*.name, 'container:main'), 'dev-main', contains(github.event.pull_request.labels.*.name, 'container:release'), 'dev-release', format('dev-{0}', github.base_ref))) || format('dev-{0}', github.ref_name) }}

    needs: check_commit
    if: ${{ needs.check_commit.outputs.skip != 'true' }}

    steps:
      - name: Install dependencies
        run: |
          apt update
          apt install -y git-lfs
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install Firedrake from ${{ env.FIREDRAKE_REPO }}@${{ env.FIREDRAKE_REF }} (DROP BEFORE MERGE)
        run: |
          # The image has Firedrake installed in editable mode from the git
          # clone in /opt/firedrake, so checking out another commit there
          # changes the code that is imported. The reinstall rebuilds the
          # Cython extensions of firedrake and pyop3 for that commit.
          # --no-deps keeps the PETSc, UFL, FIAT and other packages of the
          # image, which is correct while the branch changes no dependency.
          git config --global --add safe.directory /opt/firedrake
          cd /opt/firedrake
          echo "Firedrake in the container: $(git log -1 --format='%h %ci %s')"
          git fetch --no-tags "https://github.com/${FIREDRAKE_REPO}.git" "${FIREDRAKE_REF}"
          git checkout --detach FETCH_HEAD
          echo "Firedrake installed for this run: $(git log -1 --format='%h %ci %s')"
          python3 -m pip install --no-deps --no-build-isolation --editable /opt/firedrake
          # Remove compiled kernels of the container's Firedrake from the disk cache.
          firedrake-clean

      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # disable cache on hosted runner, otherwise we need a lock file
          enable-cache: false

      - name: Run smoke test
        run: |
          uv venv --system-site-packages
          uv pip install .
          . .venv/bin/activate
          make -C demos/mantle_convection/base_case check

  build:
    name: Benchmark regression test
    runs-on: self-hosted
    container:
      # Prefer specific branch, then PR base, then actual branch
      image: firedrakeproject/firedrake-vanilla-default:${{ inputs.target_container || (github.event_name == 'pull_request' && case(contains(github.event.pull_request.labels.*.name, 'container:main'), 'dev-main', contains(github.event.pull_request.labels.*.name, 'container:release'), 'dev-release', format('dev-{0}', github.base_ref))) || format('dev-{0}', github.ref_name) }}
      options: --cap-add SYS_NICE --shm-size=1024m

    concurrency:
      group: testing-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true

    needs: smoke_test
    if: ${{ needs.check_commit.outputs.skip != 'true' }}

    env:
      OMP_NUM_THREADS: 1

    steps:
      - name: Install prerequisites
        run: |
          apt update
          apt install -y time unzip git-lfs gmsh gcc cmake libsqlite3-dev libhwloc-dev \
              patchelf libgl1-mesa-dev libglu1-mesa-dev libglew-dev \
              libboost-dev libboost-python-dev libboost-thread-dev libboost-program-options-dev \
              libqt5opengl5-dev libqt5svg5-dev libqwt-qt5-dev libqt5xmlpatterns5-dev \
              libgdal-dev libcgal-dev libproj-dev proj-bin zlib1g-dev \
              libgtest-dev
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install Firedrake from ${{ env.FIREDRAKE_REPO }}@${{ env.FIREDRAKE_REF }} (DROP BEFORE MERGE)
        run: |
          # The image has Firedrake installed in editable mode from the git
          # clone in /opt/firedrake, so checking out another commit there
          # changes the code that is imported. The reinstall rebuilds the
          # Cython extensions of firedrake and pyop3 for that commit.
          # --no-deps keeps the PETSc, UFL, FIAT and other packages of the
          # image, which is correct while the branch changes no dependency.
          git config --global --add safe.directory /opt/firedrake
          cd /opt/firedrake
          echo "Firedrake in the container: $(git log -1 --format='%h %ci %s')"
          git fetch --no-tags "https://github.com/${FIREDRAKE_REPO}.git" "${FIREDRAKE_REF}"
          git checkout --detach FETCH_HEAD
          echo "Firedrake installed for this run: $(git log -1 --format='%h %ci %s')"
          python3 -m pip install --no-deps --no-build-isolation --editable /opt/firedrake
          # Remove compiled kernels of the container's Firedrake from the disk cache.
          firedrake-clean

      - name: Fix OpenMPI installation
        run: |
            # Remove block on files in /usr/share/doc being installed
            rm /etc/dpkg/dpkg.cfg.d/excludes
            apt reinstall libprrte-dev
            for i in /usr/share/doc/libprrte-dev/*; do
              [[ ${i#*\.} == "txt.gz" ]] && gunzip $i
            done
            ln -s /usr/share/doc/libprrte-dev /usr/lib/x86_64-linux-gnu/prrte3/share/prte
        shell: bash

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Fetch LFS artifacts
        run: |
          git lfs checkout

      - name: Fetch task spooler
        uses: actions/checkout@v5
        with:
          repository: dsroberts/tsp_for_hpc
          path: ./tsp
          ref: ${{ vars.TSP_VERSION }}

      - name: Build task spooler
        run: |
          cmake ./tsp -B ./tsp_build
          cmake --build ./tsp_build
          mv ./tsp_build/tsp-hpc /usr/local/bin/tsp

      - name: Fetch gplates
        uses: actions/checkout@v5
        with:
          repository: dsroberts/GPlates
          path: ./gplates
          ref: PyGPlates-1.0.0

      - name: Install Python dependencies
        run: |
          uv venv --system-site-packages
          uv pip install ./gplates
          uv pip install .[demos,optimisation,gplates]
          # Clear gplates otherwise pytest picks up the tests from
          # its source tree
          rm -rf ./gplates

      - name: Check out repository linked to Trim et al. (2023)
        uses: actions/checkout@v5
        with:
          repository: seantrim/exact-thermochem-solution
          path: ./flib

      - name: Compile flib (Trim et al., 2023)
        run: |
          source .venv/bin/activate
          uv pip install meson
          cd flib/Python
          rm *.so
          sed -i 's/f2py3/f2py/' create_library.sh
          source create_library.sh
          cp *.so ../../tests/multi_material
        shell: bash

      - name: Run test
        id: run_tests
        run: |
          firedrake-clean
          tsp --timeout -T 9000
          tsp --memprof
          . .venv/bin/activate
          uv run doit run --process $(nproc --all) --continue --always-execute run_case || true
        env:
          GADOPT_LOGLEVEL: INFO

      - name: Pytest
        id: run_pytest
        run: |
          . .venv/bin/activate
          python -m pytest -m 'not longtest' --junit-xml=test_results.xml

      - name: Pytest report
        uses: mikepenz/action-junit-report@v6
        if: ${{ !cancelled() && steps.run_pytest.conclusion != 'skipped' }}
        with:
          check_name: Test suite report
          report_paths: test_results.xml
          include_passed: true
          annotate_only: true

      - name: Output timing information
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tsp --gh-summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: run-log
          path: /tmp/tsp_db.sqlite3
