name: Render demo notebooks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger:
        type: boolean
        default: false
        description: 'Trigger a website rebuild if this run is successful'
      target_container:
        description: 'The target container tag (full tag, e.g. dev-main)'
        type: string
        required: true
        default: dev-main

jobs:
  render:
    uses: g-adopt/workflows/.github/workflows/gadopt-render.yml@main
    with:
      target_container: ${{ inputs.target_container }}
      trigger: ${{ inputs.trigger }}
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
