[pytest]
python_files = test_*.py
markers =
  longtest
  demo
# `parallel` comes from the `mpi-pytest` plugin, which re-launches a marked
# test under `mpiexec` by itself - plain `python -m pytest` runs it, and CI
# therefore runs it too. It is registered here so that the mark is a declared
# one rather than an unknown mark that pytest merely warns about.
#
# Before 2026-08-12 nothing in this repository used it. Every parallel test
# instead began `if COMM_WORLD.size < 2: pytest.skip(...)`, which skips green
# under the CI command (`python -m pytest -m 'not longtest'`, Makefile:10 and
# .github/workflows/test.yml:171) and runs only when somebody remembers to
# launch pytest under mpiexec by hand. A correctly designed test that does not
# run reads as coverage while providing none.
  parallel