[pytest]
python_files = test_*.py
markers =
  longtest
  demo
# `parallel` comes from the `mpi-pytest` plugin. A test marked
# `parallel(nprocs=N)` runs on N ranks: either the plugin starts `mpiexec`
# from the pytest process, or pytest itself runs under `mpiexec -n N` and the
# plugin then selects it with `-m 'parallel[N]'`. CI uses the second way,
# because the Open MPI of its Ubuntu container cannot start `mpiexec` from
# inside a pytest process (.github/workflows/test.yml, step "Pytest on 2
# ranks"). A parallel test must assert its rank count
# (tests/unit/parallel_ranks.py), so that it fails instead of passing on one
# rank when the plugin is missing.
  parallel